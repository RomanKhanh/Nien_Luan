spring.application.name=brainblocks
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@brainblocks.local}
app.admin.password=${ADMIN_PASSWORD}

momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/payment/momo-return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payments/momo-ipn}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# true = tạo danh mục + sản phẩm mẫu khi DB chưa có sản phẩm nào (chạy thử giao diện)
app.seed.demo-data=${SEED_DEMO_DATA:false}

# thư mục lưu ảnh sản phẩm admin tải lên (tương đối so với thư mục chạy app), phục vụ công khai qua /uploads/**
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
