spring.application.name=brainblocks
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@brainblocks.local}
app.admin.password=${ADMIN_PASSWORD}

momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/payment/momo-return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payments/momo-ipn}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# true = tạo danh mục + sản phẩm mẫu khi DB chưa có sản phẩm nào (chạy thử giao diện)
app.seed.demo-data=${SEED_DEMO_DATA:false}

# hệ số alpha của điểm kỹ năng hồ sơ bé (0 < alpha <= 1): mỗi món tăng p/10 x (10 - điểm hiện tại) x alpha.
# Đổi giá trị này thì lần khởi động sau mọi hồ sơ kỹ năng được tính lại.
app.skill-score.alpha=${SKILL_SCORE_ALPHA:0.5}

# số ngày khách được gửi hàng về sau khi yêu cầu đổi / trả hàng được duyệt; quá hạn thì yêu cầu tự bị từ chối
app.complaint.return-window-days=${RETURN_WINDOW_DAYS:7}

# bằng chứng khiếu nại (video mở hàng, ảnh / video tình trạng): thư mục RIÊNG, không phục vụ công khai,
# chỉ tải qua API có kiểm tra quyền. Ảnh tối đa 10MB, video tối đa max-video-mb
app.complaint.evidence-dir=${EVIDENCE_DIR:private-uploads/complaints}
app.complaint.max-video-mb=${EVIDENCE_MAX_VIDEO_MB:100}
# file bằng chứng tự xóa sau số ngày này kể từ khi yêu cầu đóng (trừ yêu cầu admin bật "giữ lại");
# bản ghi yêu cầu và thông tin file vẫn giữ để thống kê
app.complaint.evidence-retention-days=${EVIDENCE_RETENTION_DAYS:30}

# thư mục lưu ảnh sản phẩm admin tải lên (tương đối so với thư mục chạy app), phục vụ công khai qua /uploads/**
app.upload.dir=${UPLOAD_DIR:uploads}
# giới hạn chung cho multipart, đủ cho 1 video mở hàng + vài ảnh / video tình trạng;
# ảnh sản phẩm tự giới hạn 5MB trong ProductImageService
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# ===== phí vận chuyển (ShippingCalculator), tiền VND, khối lượng gram, kích thước cm =====
# khối lượng quy đổi (kg) = dài x rộng x cao / hệ số; khối lượng tính phí = max(thực, quy đổi)
app.shipping.volumetric-divisor=6000
# sức chứa một kiện (theo khối lượng tính phí); đơn nặng hơn được tách thành nhiều kiện
app.shipping.parcel-max-grams=20000
# bậc khối lượng: bậc đầu tính phí bậc đầu, mỗi 0,5 kg thêm cộng phí mỗi bậc thêm
app.shipping.weight-step-grams=500
app.shipping.rounding-step=500
# giá theo miền của tỉnh người nhận (shop ở Cần Thơ): Miền Nam / Miền Trung / Miền Bắc, xem Region
app.shipping.zones.south.first-step-fee=22000
app.shipping.zones.south.additional-step-fee=4000
app.shipping.zones.central.first-step-fee=30000
app.shipping.zones.central.additional-step-fee=5500
app.shipping.zones.north.first-step-fee=36000
app.shipping.zones.north.additional-step-fee=6500
# phụ phí cồng kềnh, tính 1 lần cho cả đơn khi có món có thể tích gói > ngưỡng hoặc cạnh > ngưỡng
app.shipping.bulky.fee=20000
app.shipping.bulky.volume-threshold-cm3=30000
app.shipping.bulky.edge-threshold-cm=100
