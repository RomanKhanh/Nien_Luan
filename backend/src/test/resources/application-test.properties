# Cấu hình cho profile "test": chạy test không cần Postgres và file .env.
# Các khóa ở đây ghi đè application.properties (kể cả giá trị đọc từ .env nếu máy có).

# H2 trong bộ nhớ, giả lập PostgreSQL; mỗi lần chạy test tạo schema mới rồi xóa
spring.datasource.url=jdbc:h2:mem:brainblocks;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# khóa JWT chỉ dùng cho test (Base64, đủ 256 bit), không dùng cho môi trường thật
jwt.secret=YnJhaW5ibG9ja3MtdGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbg==
jwt.expiration=3600000

# AdminSeeder tạo admin trong H2 thay vì ghi vào DB thật
app.admin.email=admin@test.local
app.admin.password=test-admin-password

# ảnh tải lên trong lúc test nằm trong target/, mvn clean là sạch
app.upload.dir=target/test-uploads

# bằng chứng khiếu nại tải lên trong lúc test cũng nằm trong target/
app.complaint.evidence-dir=target/test-evidence
